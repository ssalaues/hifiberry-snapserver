version: '3'
services:
  snapserver:
    container_name: snapserver
    command: snapserver -c /config/snapserver.conf
    image: ssalaues/snapcast:0.35.0-librespot0.8.0
    volumes:
      - /tmp:/tmp
      - /data/docker/snapserver/config:/config
    restart: always
    network_mode: host
    user: "0"
